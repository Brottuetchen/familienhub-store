name: Plugin tests

on:
  pull_request:
    paths: ["plugins/**", ".github/workflows/plugins.yml"]
  push:
    branches: [main]
    paths: ["plugins/**", ".github/workflows/plugins.yml"]

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.find.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: echo "plugins=$(ls -d plugins/*/ | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  test:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.list.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Brottuetchen/familienhub
          path: familienhub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: familienhub/backend/requirements.txt
      - run: pip install -r familienhub/backend/requirements.txt
      - name: pytest
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          export DATA_DIR="$(mktemp -d)"
          PYTHONPATH="$GITHUB_WORKSPACE/familienhub/backend" python -m pytest -q
