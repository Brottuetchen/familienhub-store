name: Validate index

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Brottuetchen/familienhub
          path: familienhub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: familienhub/backend/requirements.txt
      - run: pip install -r familienhub/backend/requirements.txt
      - run: PYTHONPATH=familienhub/backend python tools/validate.py
