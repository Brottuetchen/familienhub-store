[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "familienhub-plugin-grocy"
version = "1.0.0"
description = "Grocy stock and shopping list for Familienhub"
requires-python = ">=3.12"
# fastapi, httpx and friends come from the hub.
dependencies = []

[project.entry-points."familienhub.plugins"]
grocy = "fh_plugin_grocy.plugin:GrocyPlugin"

[tool.setuptools.packages.find]
include = ["fh_plugin_grocy*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
