[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "familienhub-plugin-webuntis"
version = "1.0.0"
description = "WebUntis timetable, cancellations and substitutions for Familienhub"
requires-python = ">=3.12"
# Only what the hub does not ship (httpx and fastapi come from the hub).
dependencies = []

[project.entry-points."familienhub.plugins"]
webuntis = "fh_plugin_webuntis.plugin:WebUntisPlugin"

[tool.setuptools.packages.find]
include = ["fh_plugin_webuntis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:sqlalchemy.*"]
